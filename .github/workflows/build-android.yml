name: Build Android APK

# Runs on every push, and can be started by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Debug-signed: installable directly on a phone without a keystore.
      # For Play Store distribution this would need a real signing config.
      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: seventy-five-days-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
